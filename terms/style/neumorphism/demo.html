<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新拟态 Neumorphism · ui-dict S-03</title>
<style>
  :root {
    --dist: 10px; --blur: 22px; --hue: 210;
    /* 三色全部由 HUE 派生：背景与元件永远同色材料，浮雕逻辑才成立。
       一旦元件用独立色相（不是只动明度），那就退化成普通卡片，不是新拟态 */
    --bg:    hsl(var(--hue) 18% 87%);                    /* 材料底色 */
    --dark:  hsl(var(--hue) 24% 58% / .45);              /* 背光侧暗影（中性偏同色相，禁彩色发光） */
    --light: hsl(var(--hue) 45% 98.5% / .85);            /* 光源侧亮影 */
    --ink:   hsl(var(--hue) 32% 26%);                    /* 文字：与 87% 底保持可读对比 */
    --line:  hsl(var(--hue) 22% 70% / .8);               /* 微描边：对比度兜底，见 pitfalls */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 光源统一：全页左上亮、右下暗。一个凸件一个凹件若方向互相拧着，浮雕当场穿帮 */
  .convex {
    background: var(--bg); border: 1px solid var(--line);
    box-shadow:
      var(--dist) var(--dist) var(--blur) var(--dark),          /* 右下暗 */
      calc(var(--dist) * -1) calc(var(--dist) * -1) var(--blur) var(--light); /* 左上亮 */
  }
  .concave {
    background: var(--bg); border: 1px solid var(--line);
    box-shadow:
      inset var(--dist) var(--dist) var(--blur) var(--dark),    /* 内壁上光侧在暗 */
      inset calc(var(--dist) * -1) calc(var(--dist) * -1) var(--blur) var(--light);
  }

  .panel { width: min(340px, 90vw); border-radius: 28px; padding: 26px; display: grid; gap: 24px; }
  .panel h1 { font-size: 15px; margin: 0; letter-spacing: .05em; }

  /* ── 凹陷显示窗：inset 双投影 = 嵌进材料的读数屏 ── */
  .screen { border-radius: 16px; padding: 16px 18px; text-align: center; }
  .screen .val { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .screen small { display: block; font-size: 11px; color: hsl(var(--hue) 20% 38%); margin-top: 2px; }

  /* ── 开关：凹陷槽 + 凸起旋钮；按下旋钮时外投影翻转为内投影（pressed 态）── */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .row label { font-size: 13.5px; }
  .switch {
    width: 86px; height: 46px; border-radius: 999px; position: relative;
    cursor: pointer; border: 1px solid var(--line); background: var(--bg);
    box-shadow: inset var(--dist) var(--dist) var(--blur) var(--dark),
                inset calc(var(--dist) * -1) calc(var(--dist) * -1) var(--blur) var(--light);
    padding: 0;
  }
  .knob {
    position: absolute; top: 5px; left: 5px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--line);
    box-shadow: var(--dist) var(--dist) var(--blur) var(--dark),
                calc(var(--dist) * -1) calc(var(--dist) * -1) var(--blur) var(--light);
    display: grid; place-items: center; font-size: 14px; color: hsl(var(--hue) 24% 52%);
    transition: transform .22s cubic-bezier(.34,1.4,.5,1), box-shadow .12s ease;
  }
  .switch[aria-checked="true"] .knob { transform: translateX(40px); color: hsl(var(--hue) 45% 32%); }
  /* pressed：外投影翻转为内投影——"被压进材料"的触感瞬间 */
  .switch:active .knob, .push:active {
    box-shadow: inset calc(var(--dist) * .6) calc(var(--dist) * .6) calc(var(--blur) * .6) var(--dark),
                inset calc(var(--dist) * -.6) calc(var(--dist) * -.6) calc(var(--blur) * .6) var(--light);
  }
  .switch:focus-visible, .push:focus-visible, input[type="range"]:focus-visible {
    outline: 2px solid hsl(var(--hue) 45% 34%); outline-offset: 3px; /* 浮雕看不见焦点？描边兜底 */
  }

  /* ── 滑块：凹陷轨道 + 凸起圆钮 ── */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 46px;
    background: transparent; cursor: pointer; margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 18px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
    box-shadow: inset 4px 4px 9px var(--dark), inset -4px -4px 9px var(--light); /* 轨道恒凹，不随 DIST 放大，免得吞掉圆钮 */
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%; margin-top: -7px;
    background: var(--bg); border: 1px solid var(--line);
    box-shadow: calc(var(--dist) * .5) calc(var(--dist) * .5) calc(var(--blur) * .6) var(--dark),
                calc(var(--dist) * -.5) calc(var(--dist) * -.5) calc(var(--blur) * .6) var(--light);
  }
  input[type="range"]::-moz-range-track {
    height: 18px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
    box-shadow: inset 4px 4px 9px var(--dark), inset -4px -4px 9px var(--light);
  }
  input[type="range"]::-moz-range-thumb {
    width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line);
    box-shadow: calc(var(--dist) * .5) calc(var(--dist) * .5) calc(var(--blur) * .6) var(--dark),
                calc(var(--dist) * -.5) calc(var(--dist) * -.5) calc(var(--blur) * .6) var(--light);
  }

  /* ── 凸起按钮：演示 pressed 翻转 ── */
  .push {
    border-radius: 16px; padding: 13px; font: inherit; font-size: 13.5px; color: var(--ink);
    cursor: pointer; transition: box-shadow .12s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .knob, .push, .switch:active .knob { transition: none; }
  }
</style>
</head>
<body>
  <main class="panel convex" aria-label="新拟态控制面板">
    <h1>环境控制 · NEUMORPHIC</h1>

    <div class="screen concave">
      <span class="val" id="temp">22.0°</span>
      <small id="state">风扇 · 关</small>
    </div>

    <div class="row">
      <label id="swLabel" for="sw">风扇</label>
      <button class="switch" id="sw" role="switch" aria-checked="false" aria-labelledby="swLabel">
        <span class="knob" aria-hidden="true">⏻</span>
      </button>
    </div>

    <div class="row" style="display:grid; gap:10px">
      <label for="rg">目标温度 <span id="rgOut">22.0°C</span></label>
      <input type="range" id="rg" min="16" max="30" step="0.5" value="22" aria-label="目标温度">
    </div>

    <button class="push convex" id="pushBtn" type="button">按下我：外投影 → 内投影</button>
  </main>

<script>
(function () {
  /* ui-dict:params:start */
  const PARAMS = { "DIST": 10, "BLUR": 22, "HUE": 210 };
  /* ui-dict:params:end */

  const root = document.documentElement.style;
  // 真实消费三个参数：偏移/模糊决定浮雕软硬，HUE 通过 hsl 派生整套三色（底/亮/暗）
  root.setProperty("--dist", PARAMS.DIST + "px");
  root.setProperty("--blur", PARAMS.BLUR + "px");
  root.setProperty("--hue", String(PARAMS.HUE));

  const sw = document.getElementById("sw");
  const rg = document.getElementById("rg");
  const temp = document.getElementById("temp");
  const state = document.getElementById("state");
  const rgOut = document.getElementById("rgOut");

  sw.addEventListener("click", function () {
    const on = sw.getAttribute("aria-checked") !== "true";
    sw.setAttribute("aria-checked", String(on));
    state.textContent = "风扇 · " + (on ? "开" : "关");
  });
  rg.addEventListener("input", function () {
    temp.textContent = Number(rg.value).toFixed(1) + "°";
    rgOut.textContent = Number(rg.value).toFixed(1) + "°C";
  });
})();
</script>
</body>
</html>
