<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粘性分区 Sticky Section · ui-dict L-04</title>
<style>
  :root { --top: 8px; --radius: 10px; --nav-h: 8px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 40px; background: #f6f5f2; color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 模拟"吸顶导航"：fixed 永远在场——这正是它与 sticky 的分界。
     它的高度由 TOP 参数驱动：分组标题钉在 TOP 处 = 给导航让位 */
  .fakebar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: var(--nav-h);
    background: #1d1a16; color: rgba(255,255,255,.85); font-size: 11px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    transition: height .18s ease;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: calc(var(--top) + 26px) 0 6px; }
  .hint { font-size: 12.5px; color: #8a857c; margin: 0 0 16px; line-height: 1.6; }

  .toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12.5px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #6b6459; }
  .toolbar input { accent-color: #b4530a; }

  /* 注意：.sections 与每个 .section 上都没有 overflow / transform——
     任何一个祖先写了 overflow:hidden 或 transform，sticky 立刻被杀（勾选框就是演示这个翻车） */
  .sections.killed .section { overflow: hidden; }

  .section { margin-bottom: 10px; }

  /* sticky 核心：top = 钉住偏移；背景必须不透明，否则列表行从标题底下穿出来叠成鬼影 */
  .section > h2 {
    position: sticky;
    top: var(--top);                 /* 等于吸顶导航高度：钉在它下缘，不叠上去 */
    margin: 0;
    padding: 9px 14px;
    font-size: 13px; letter-spacing: .04em;
    background: #efece5;             /* 不透明实底（通透在这里是 bug） */
    border: 1px solid #e2ddd2;
    border-radius: var(--radius);
    color: #6b4e16;
    z-index: 5;                      /* 同 top 时配合后 DOM 盖前 DOM，呈现"依次顶掉" */
  }
  /* 组滚完，标题随组离开——活动范围 = 父 .section 的下缘 */

  .section ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .section li {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 6px; border-bottom: 1px solid #eceadf; font-size: 14px;
  }
  .section li:hover { background: #fbfaf7; }
  .ava {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600;
  }
  .section li small { margin-left: auto; color: #a49d90; font-size: 11.5px; }

  @media (prefers-reduced-motion: reduce) {
    .fakebar { transition: none; }
  }
</style>
</head>
<body>
  <div class="fakebar" aria-hidden="true">fixed 导航 · 永远在场（sticky 标题到组尾会走，fixed 不会）</div>

  <main class="wrap">
    <h1>联系人 · Sticky Section</h1>
    <p class="hint">向下滚动：每组标题钉在顶部，下一组滑上来<b>依次顶掉</b>上一组；整组滚完，标题跟着离开。
       详情页 TOP 滑杆 = 吸顶导航高度，观察"让位"。下面的勾选框演示头号翻车：<b>祖先 overflow 杀死 sticky</b>。</p>
    <div class="toolbar">
      <label><input type="checkbox" id="kill"> 作死试验：给分组容器加 overflow:hidden（看标题如何失灵）</label>
    </div>
    <div class="sections" id="sections"></div>
  </main>

<script>
(function () {
  /* ui-dict:params:start */
  const PARAMS = { "TOP": 8, "RADIUS": 10 };
  /* ui-dict:params:end */

  const root = document.documentElement.style;
  root.setProperty("--top", PARAMS.TOP + "px");
  root.setProperty("--radius", PARAMS.RADIUS + "px");
  // 导航条高度与钉住偏移同源：TOP 就是"给吸顶导航让位"的量
  root.setProperty("--nav-h", PARAMS.TOP + "px");

  const GROUPS = [
    { k: "A", items: [["安雅 · 设计", "产品组"], ["敖烈", "外部联系人"], ["欧阳帆", "前端"], ["艾立", "实习"]] },
    { k: "B", items: [["白露", "增长"], ["毕至", "法务"], ["邴郁文", "供应链"], ["卜同", "外部联系人"], ["白一舟", "前端"]] },
    { k: "C", items: [["蔡明远", "后端"], ["陈默", "数据"], ["崔屿", "设计"]] },
    { k: "D", items: [["戴安娜", "市场"], ["丁小满", "产品组"], ["杜若", "行政"], ["东郭先生", "外部联系人"], ["段黎", "前端"], ["大飞", "增长"]] }
  ];
  const COLORS = ["#0b4f6c", "#7c5c2f", "#4f6c0b", "#6c0b4f", "#2f5c7c", "#5c2f7c"];
  const box = document.getElementById("sections");

  GROUPS.forEach(function (g, gi) {
    const sec = document.createElement("section");
    sec.className = "section";
    const h = document.createElement("h2");
    h.textContent = "分组 " + g.k;
    sec.appendChild(h);
    const ul = document.createElement("ul");
    g.items.forEach(function (it, i) {
      const li = document.createElement("li");
      const ch = it[0].slice(0, 1);
      // 头像色块为本地生成的内联渐变，无网络图片
      li.innerHTML =
        '<span class="ava" style="background:' + COLORS[(gi + i) % COLORS.length] + '">' + ch + '</span>' +
        '<span>' + it[0] + '</span><small>' + it[1] + '</small>';
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    box.appendChild(sec);
  });

  // 作死试验：给 sticky 的祖先（.section 自身）加 overflow:hidden，
  // sticky 改为向那个"看不见在滚"的盒子吸附 → 视觉上标题不再钉住。
  document.getElementById("kill").addEventListener("change", function (e) {
    box.classList.toggle("killed", e.target.checked);
  });
})();
</script>
</body>
</html>
