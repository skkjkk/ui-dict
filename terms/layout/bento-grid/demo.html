<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便当格布局 Bento Grid · ui-dict L-01</title>
<style>
  :root { --cols: 4; --gap: 14px; --radius: 18px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px; background: #f6f5f2; color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .bento {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-auto-rows: 140px;
    gap: var(--gap);
    grid-auto-flow: dense;
  }
  .tile {
    background: #fff; border: 1px solid #eae6dd; border-radius: var(--radius);
    padding: 18px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; justify-content: flex-end;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  /* 只用 transform 抬起，绝不改布局尺寸（避免整墙重排抖动） */
  .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.10); }
  .tile b { font-size: 15px; }
  .tile small { color: #8a857c; font-size: 12.5px; margin-top: 3px; }
  .tile .emoji { position: absolute; top: 14px; left: 16px; font-size: 22px; }

  .hero { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg,#0b4f6c,#3a8fb0); color:#fff; border:0; }
  .hero b { font-size: 22px; } .hero small { color: rgba(255,255,255,.85); font-size: 13px; }
  .wide { grid-column: span 2; }
  .tall { grid-row: span 2; }

  @media (max-width: 640px) {
    .bento { grid-template-columns: 1fr; grid-auto-rows: 120px; }
    .hero, .wide { grid-column: auto; }
    .hero { grid-row: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; } .tile:hover { transform: none; }
  }
</style>
</head>
<body>
  <h1>功能一览 · Bento Grid</h1>
  <div class="bento">
    <div class="tile hero"><span class="emoji">✦</span><b>核心能力</b><small>最大的格子 = 最重要的信息，面积即权重</small></div>
    <div class="tile"><span class="emoji">⚡</span><b>快速</b><small>1×1</small></div>
    <div class="tile"><span class="emoji">🔒</span><b>安全</b><small>1×1</small></div>
    <div class="tile wide"><span class="emoji"></span><b>可组合</b><small>2×1 横向跨格</small></div>
    <div class="tile tall"><span class="emoji">📊</span><b>数据</b><small>1×2 纵向跨格</small></div>
    <div class="tile"><span class="emoji"></span><b>深色</b><small>1×1</small></div>
    <div class="tile"><span class="emoji">🔌</span><b>插件</b><small>1×1</small></div>
    <div class="tile wide"><span class="emoji">🚀</span><b>一键部署</b><small>2×1</small></div>
  </div>

<script>
(function () {
  /* ui-dict:params:start */
  const PARAMS = { "COLS": 4, "GAP": 14, "RADIUS": 18 };
  /* ui-dict:params:end */

  const root = document.documentElement.style;
  root.setProperty("--cols", String(PARAMS.COLS));
  root.setProperty("--gap", PARAMS.GAP + "px");
  root.setProperty("--radius", PARAMS.RADIUS + "px");
})();
</script>
</body>
</html>
