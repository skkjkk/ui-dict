<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>底部弹层 Bottom Sheet · ui-dict C-01</title>
<style>
  :root { --scrim: 0.4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f6f5f2; color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page { padding: 22px 20px; }
  .page h1 { font-size: 18px; margin: 0 0 6px; }
  .page p { font-size: 13.5px; color: #6b675f; margin: 0 0 14px; line-height: 1.7; }
  #open {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 11px 22px; border: 0; border-radius: 999px;
    background: #141414; color: #fff; font-size: 14px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.18); z-index: 5;
  }

  .scrim { position: fixed; inset: 0; background: #000; opacity: 0;
           pointer-events: none; transition: opacity .24s ease-out; z-index: 10; }
  .scrim.show { opacity: var(--scrim); pointer-events: auto; }

  /* 面板高度固定为 full，位置全靠 translateY（合成器动画，不改 height） */
  .sheet {
    position: fixed; left: 50%; bottom: 0; width: min(560px, 100%); z-index: 11;
    background: #fff; border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 40px rgba(0,0,0,.18);
    display: flex; flex-direction: column;
    transform: translate(-50%, 120%); visibility: hidden;
  }
  .sheet.open { visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.dragging { transition: none; }

  .grip { padding: 12px 0 6px; display: flex; justify-content: center;
          touch-action: none; cursor: grab; }
  .grip::after { content: ""; width: 36px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.25); }
  header { padding: 2px 20px 12px; border-bottom: 1px solid #eee;
           display: flex; align-items: baseline; justify-content: space-between;
           touch-action: none; cursor: grab; }
  header b { font-size: 16px; } header span { font-size: 12px; color: #999; }
  .body { overflow-y: auto; padding: 6px 20px 26px; flex: 1; min-height: 0;
          -webkit-overflow-scrolling: touch; }
  .row { padding: 14px 0; border-bottom: 1px solid #f2f2f2; font-size: 14px;
         display: flex; justify-content: space-between; gap: 12px; }
  .row small { color: #999; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .sheet.open, .scrim { transition: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1>附近的酒店 · 214 家</h1>
    <p>演示词条 C-01。点下方按钮打开底部弹层；拖住顶部把手或标题行上下移动，
       松手自动吸附到最近的停靠位（peek / half / full）；拖得足够低再松手即关闭。</p>
  </main>
  <button id="open" type="button">查看结果面板</button>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="酒店结果面板">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <header id="hdr"><b>筛选结果</b><span>拖拽调整高度 · Esc 关闭</span></header>
    <div class="body" id="list"></div>
  </section>

<script>
(function () {
  /* ui-dict:params:start */
  const PARAMS = { "PEEK": 15, "HALF": 60, "SCRIM": 0.4 };
  /* ui-dict:params:end */

  const sheet = document.getElementById("sheet");
  const scrim = document.getElementById("scrim");
  const openBtn = document.getElementById("open");
  const list = document.getElementById("list");

  for (let i = 1; i <= 14; i++) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span>云栖酒店 ${"ABCD"[i % 4]}${i} 号院</span><small>¥${80 + i * 17}/晚</small>`;
    list.appendChild(r);
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.style.setProperty("--scrim", String(PARAMS.SCRIM));

  // 面板满高 = full 停靠位；位移 t = fullHeight - visibleFraction·H
  let fullPx = 0;
  function metrics() {
    const H = innerHeight;
    fullPx = Math.round(H * 0.94);
    sheet.style.height = fullPx + "px";
    return { H, t: [fullPx - H * PARAMS.PEEK / 100, fullPx - H * PARAMS.HALF / 100, 0] };
  }
  let M = metrics();
  let cur = M.t[1], open = false, dragging = false, sy = 0, st = 0, lastY = 0, lastT = 0, v = 0;

  function place(t, animate) {
    cur = t;
    sheet.style.transition = animate && !reduce ? "" : "none";
    sheet.style.transform = `translate(-50%, ${t}px)`;
  }

  function openSheet() {
    M = metrics(); open = true;
    scrim.classList.add("show");
    sheet.classList.add("open");
    place(M.t[1]);
    list.focus?.();
    if (!document.activeElement || document.activeElement === document.body) gripTabFallback();
  }
  function gripTabFallback() { /* 焦点圈定的入口元素 */ sheet.querySelector("header").tabIndex = -1; }
  function closeSheet() {
    open = false;
    scrim.classList.remove("show");
    sheet.classList.remove("open");
    place(fullPx * 1.2);
    openBtn.focus();
  }

  openBtn.addEventListener("click", openSheet);
  scrim.addEventListener("pointerdown", closeSheet);
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && open) { e.preventDefault(); closeSheet(); }
    // 焦点圈定：Tab 不逃出面板（demo 简化版：拦截跳出到页面元素的情况）
    if (e.key === "Tab" && open) {
      const f = sheet.contains(document.activeElement) ? document.activeElement : null;
      if (!f) { e.preventDefault(); openBtn.blur(); }
    }
  });
  addEventListener("resize", () => { M = metrics(); if (open) place(Math.min(cur, M.t[0])); });

  function down(e) {
    if (!open) return;
    dragging = true; sheet.classList.add("dragging");
    sy = e.clientY; st = cur; v = 0; lastY = e.clientY; lastT = performance.now();
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!dragging) return;
    const now = performance.now();
    v = (e.clientY - lastY) / Math.max(1, now - lastT);
    lastY = e.clientY; lastT = now;
    let t = st + (e.clientY - sy);
    if (t < M.t[2]) t = M.t[2] + (t - M.t[2]) * 0.55;          // 越界 rubber-band
    if (t > M.t[0]) t = M.t[0] + (t - M.t[0]) * 0.55;
    place(t);
  }
  function up() {
    if (!dragging) return;
    dragging = false; sheet.classList.remove("dragging");
    const snaps = M.t;
    if (cur > snaps[0] + (fullPx - snaps[0]) * 0.4 || v > 0.5) return closeSheet();
    const target = snaps.reduce((a, b) => Math.abs(b - cur) < Math.abs(a - cur) ? b : a);
    place(target, true);                                        // 吸附回弹
  }

  const grip = document.getElementById("grip"), hdr = document.getElementById("hdr");
  for (const el of [grip, hdr]) {
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }
  // 内容区：滚到顶后继续下拉才接管（避免与列表滚动打架）
  list.addEventListener("pointerdown", (e) => { if (list.scrollTop <= 0) down(e); });
  list.addEventListener("pointermove", (e) => { if (dragging) move(e); });
  list.addEventListener("pointerup", up);
  place(fullPx * 1.2);
})();
</script>
</body>
</html>
