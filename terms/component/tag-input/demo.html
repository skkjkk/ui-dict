<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签输入框 Tag Input · ui-dict C-18</title>
<style>
  /* 单文件铁律：系统字体栈、零网络请求、零依赖，双击即可运行。
     流派 = 真 input + keydown：Enter/逗号 收编胶囊、空态 Backspace 删末位。
     （contenteditable 派光标管理是深坑、select multiple 伪装派无自由输入——
      两条旧路写进词条 pitfalls，demo 走最直的一条。） */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f6f5f2; color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page { padding: 22px 20px 46px; max-width: 560px; margin: 0 auto; }
  .page h1 { font-size: 18px; margin: 0 0 6px; }
  .lead { font-size: 13.5px; color: #6b675f; margin: 0 0 10px; line-height: 1.75; }
  .page code { background: #ece8e0; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  #paramline { font-size: 12px; color: #8f8a80; margin: 0 0 18px; line-height: 1.8; font-variant-numeric: tabular-nums; }
  .card { background: #fff; border: 1px solid #e5e1d8; border-radius: 14px; padding: 18px; }
  .card label.t { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 6px; }
  .sub { font-size: 12px; color: #8f8a80; margin: 8px 2px 0; line-height: 1.8; }
  .sub b { color: #0b4f6c; }
  #payload { font-size: 12px; color: #6b675f; margin: 14px 0 0; line-height: 1.8; word-break: break-all; }
  #payload code { background: #f1ede4; padding: 1px 6px; border-radius: 4px; }

  /* ===== 容器 = 一个"假输入框"：chips 与真 input 同处流式布局 ===== */
  #box {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--gap, 6px);
    border: 1px solid #cfc9bd; border-radius: 10px; background: #fff;
    padding: 8px 10px; min-height: 44px; cursor: text;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #box:focus-within { border-color: #0b4f6c; box-shadow: 0 0 0 3px rgba(11,79,108,.12); }
  #box.shake { animation: shake .3s ease; border-color: #b3392f; }
  @keyframes shake { 25%{transform:translateX(-3px)} 50%{transform:translateX(3px)} 75%{transform:translateX(-2px)} }

  /* 胶囊 chip：圆角 {RADIUS}px 试「药丸 vs 方角」两副面孔 */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #eef4f7; border: 1px solid #cfdfe8; color: #0b4f6c;
    font-size: 13px; line-height: 1;
    padding: 6px 6px 6px 10px; border-radius: var(--radius, 999px);
    animation: pop .18s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .chip .x {
    display: inline-grid; place-items: center; width: 18px; height: 18px;
    border: 0; border-radius: 50%; background: none; color: #6f96a8;
    font: inherit; font-size: 13px; cursor: pointer; flex: none;
  }
  .chip .x:hover { background: #d8e7ef; color: #b3392f; }
  .chip .x:focus-visible { outline: 2px solid #0b4f6c; outline-offset: 1px; }

  /* 真 input 吃掉余宽：flex:1 + min-width 让光标永远跟在最后一个 chip 后面 */
  #ipt {
    flex: 1; min-width: 90px; border: 0; outline: none; background: none;
    font: inherit; font-size: 13.5px; padding: 6px 2px; color: #1a1a1a;
  }
  #ipt::placeholder { color: #b3ac9f; }

  @media (prefers-reduced-motion: reduce) {
    .chip { animation: none; } #box.shake { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>标签输入框 Tag Input</h1>
  <p class="lead">演示词条 C-18。打字 → <code>Enter</code> 或逗号 → 收进一个可删胶囊；
    输入框为空时按 <code>Backspace</code> 删掉最后一个胶囊（IM 邮件收件人框的肌肉记忆）。
    重复值拒绝 + 容器抖一下；超过上限 <b id="maxn">8</b> 个同理。
    删 × 与输入全键盘可达（Tab 到每个 ×，回车删除，焦点回输入框）。
    底部一行实时回显「表单真正会提交的东西」。</p>
  <p id="paramline"></p>

  <div class="card">
    <label class="t" for="ipt">收件人</label>
    <div id="box" role="group" aria-label="标签输入框">
      <!-- 已选标签渲染在这里；隐藏镜像 input 供"表单提交"叙事 -->
      <input id="ipt" type="text" placeholder="输入后回车添加，最多 8 个"
             autocomplete="off" aria-describedby="hint">
    </div>
    <p class="sub" id="hint">Enter / , 收编一个标签 · 空输入框按 Backspace 删末位 · 点 × 删除任意标签</p>
    <p id="payload"></p>
  </div>
</main>

<script>
(function () {
  /* ui-dict:params:start */
  const PARAMS = { "MAX": 8, "RADIUS": 999, "GAP": 6 };
  /* ui-dict:params:end */
  // 参数样板（≤15 行）
  const root = document.documentElement.style;
  root.setProperty("--radius", PARAMS.RADIUS >= 60 ? "999px" : PARAMS.RADIUS + "px");
  root.setProperty("--gap", PARAMS.GAP + "px");
  document.getElementById("paramline").textContent =
    "当前参数：MAX = " + PARAMS.MAX + " 个 · RADIUS = " + PARAMS.RADIUS +
    " px · GAP = " + PARAMS.GAP + " px";
  document.getElementById("maxn").textContent = PARAMS.MAX;

  const box = document.getElementById("box");
  const ipt = document.getElementById("ipt");
  const payload = document.getElementById("payload");
  let tags = ["王芳", "product@corp.cn"];

  // ---- 渲染：单函数全量重绘（demo 规模下 diff 更新是过度设计）----
  function render() {
    box.querySelectorAll(".chip").forEach((c) => c.remove());
    for (const [i, t] of tags.entries()) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.append(t);
      const x = document.createElement("button");
      x.type = "button"; x.className = "x"; x.dataset.i = i;
      x.setAttribute("aria-label", "删除标签 " + t);
      x.textContent = "✕";
      chip.append(x);
      box.insertBefore(chip, ipt);
    }
    payload.innerHTML = tags.length
      ? "表单实际提交：<code>tags=" + encodeURIComponent(JSON.stringify(tags)) + "</code>"
      : "表单实际提交：<code>tags=[]</code>（清空态）";
    ipt.placeholder = tags.length ? "继续输入…" : "输入后回车添加，最多 " + PARAMS.MAX + " 个";
  }
  function deny() {                       // 重复/超限的统一反馈：抖容器
    box.classList.remove("shake");
    void box.offsetWidth;                 // 重启动画的标准技巧：读一次布局强制 reflow
    box.classList.add("shake");
    ipt.focus();
  }
  function add(raw) {
    const v = raw.trim().replace(/,+$/, "");
    if (!v) return;
    if (tags.length >= PARAMS.MAX || tags.includes(v)) return deny();
    tags.push(v);
    ipt.value = "";
    render();
  }

  // ---- 键盘规格：Enter/逗号收编；空态 Backspace 删末位（两条规则分开实现）----
  ipt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === "," || e.key === "，") { e.preventDefault(); add(ipt.value); }
    else if (e.key === "Backspace" && ipt.value === "" && tags.length) {
      e.preventDefault();                 // 拦住浏览器原生"退格跳上一页"
      tags.pop(); render();
    }
  });
  // 粘贴一串 "a,b,c" 也要能分发：逗号切段逐个收编
  ipt.addEventListener("paste", () => setTimeout(() => {
    const parts = ipt.value.split(/[,，]/);
    if (parts.length > 1) {
      ipt.value = parts.pop();            // 末段留在输入框，前段逐个 add
      parts.forEach((p) => add(p));
    } else add(ipt.value);
  }, 0));

  // ---- 删除 ×：容器事件委托（不给每个 chip 绑监听）----
  box.addEventListener("click", (e) => {
    const x = e.target.closest(".x");
    if (!x) return;
    tags.splice(Number(x.dataset.i), 1);
    render();
    ipt.focus();                          // 删除后焦点回输入框，键盘流不断
  });
  box.addEventListener("click", (e) => { if (e.target === box) ipt.focus(); });

  render();
})();
</script>
</body>
</html>
